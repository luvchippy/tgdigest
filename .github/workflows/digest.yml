name: forum-digest

on:
  schedule:
    # 每 10 分钟收集一轮（NodeSeek 的 RSS 只覆盖约 10 分钟，必须高频才不漏）
    - cron: '2,12,22,32,42,52 * * * *'
    # 每小时 05 分审核并推送一次
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行哪个阶段'
        type: choice
        default: dry-run
        options: [dry-run, collect, digest]

permissions:
  contents: write

concurrency:
  group: forum-digest
  cancel-in-progress: false

env:
  # 自建 Cloudflare Worker 转发（解决 NodeSeek 403），没配就是空字符串
  PROXY_PREFIX: ${{ vars.PROXY_PREFIX }}
  PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}

jobs:
  collect:
    if: github.event.schedule == '2,12,22,32,42,52 * * * *' || inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 抓取新帖入队
        env:
          COLLECT_WINDOW_MINUTES: ${{ vars.COLLECT_WINDOW_MINUTES || '20' }}
          ENABLE_JINA_FALLBACK: ${{ vars.ENABLE_JINA_FALLBACK || '1' }}
        run: node src/collect.mjs

      - name: 提交队列与去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore(collect): queue update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

  digest:
    if: github.event.schedule == '5 * * * *' || inputs.mode == 'digest' || inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 审核并推送
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TG_CHAT_ID || '6867015060' }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL || 'https://napi.luvz.top/v1' }}
          REVIEW_API_KEY: ${{ secrets.LLM_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-v4.1-flash-1017' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '6' }}
          MAX_PER_SOURCE: ${{ vars.MAX_PER_SOURCE || '0' }}
          MAX_CANDIDATES: ${{ vars.MAX_CANDIDATES || '600' }}
          INTEREST_PROFILE: ${{ vars.INTEREST_PROFILE }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
        run: node src/digest.mjs

      - name: 清空队列并提交
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore(digest): flush queue [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
