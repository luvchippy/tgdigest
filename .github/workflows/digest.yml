name: forum-collect

# 只负责抓取：把 NodeSeek / NodeLoc / LinuxDo / NHT 的新帖塞进 data/queue-*.jsonl。
# 审核由独立的 forum-review 负责，两边互不阻塞。

on:
  schedule:
    # Worker 每 30 分钟调一次，这里只是兜底
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '循环轮数（每轮约 10 分钟）'
        default: '24'

permissions:
  contents: write

concurrency:
  group: forum-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-curl-cffi-v3

      - name: 安装依赖
        run: |
          pip install --quiet curl_cffi beautifulsoup4 lxml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 长驻抓取入队
        env:
          COLLECT_ONLY: '1'
          LOOP_ROUNDS: ${{ github.event.inputs.rounds || '24' }}
          LOOP_INTERVAL_MS: '600000'
          PROXY_PREFIX: ${{ vars.PROXY_PREFIX }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          ENABLE_JINA_FALLBACK: ${{ vars.ENABLE_JINA_FALLBACK || '1' }}
          COLLECT_WINDOW_MINUTES: ${{ vars.COLLECT_WINDOW_MINUTES || '25' }}
          NODESEEK_PAGES: ${{ vars.NODESEEK_PAGES || '4' }}
          NODESEEK_DETAIL: ${{ vars.NODESEEK_DETAIL || '200' }}
        run: node scripts/loop.mjs
