name: forum-digest

on:
  schedule:
    # GitHub cron 实测投递率约 5%，这里只当"心跳"用，真正节奏由 job 内长驻循环保证
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        type: choice
        default: loop
        options: [loop, dry-run]
      rounds:
        description: '循环轮数（每轮约 11 分钟）'
        default: '24'

permissions:
  contents: write

concurrency:
  group: forum-digest
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-curl-cffi-v2

      - name: 安装依赖
        run: |
          pip install --quiet curl_cffi beautifulsoup4 lxml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 长驻抓取循环
        env:
          LOOP_ROUNDS: ${{ inputs.rounds || '24' }}
          LOOP_INTERVAL_MS: '600000'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TG_CHAT_ID || '6867015060' }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL || 'https://napi.luvz.top/v1' }}
          REVIEW_API_KEY: ${{ secrets.LLM_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-v4.1-flash-1017' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '6' }}
          MAX_PER_SOURCE: ${{ vars.MAX_PER_SOURCE || '0' }}
          MAX_CANDIDATES: ${{ vars.MAX_CANDIDATES || '2000' }}
          INTEREST_PROFILE: ${{ vars.INTEREST_PROFILE }}
          COLLECT_WINDOW_MINUTES: ${{ vars.COLLECT_WINDOW_MINUTES || '25' }}
          NODESEEK_PAGES: ${{ vars.NODESEEK_PAGES || '3' }}
          NODESEEK_DETAIL: ${{ vars.NODESEEK_DETAIL || '45' }}
          ENABLE_JINA_FALLBACK: ${{ vars.ENABLE_JINA_FALLBACK || '1' }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
        run: node scripts/loop.mjs
