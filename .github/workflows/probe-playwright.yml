name: probe-playwright

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 安装 playwright
        run: |
          npm i playwright --no-save
          npx playwright install --with-deps chromium
      - name: 用真浏览器访问 NodeSeek
        run: node scripts/probe-pw.mjs
